# Release (A11, H4): runs when a version tag (v1.0.0) is pushed, and only
# then. Every artifact is built here, never on a laptop: the wheel and the
# source distribution go to PyPI through Trusted Publishing (no token; PyPI
# checks this workflow's identity, and attaches attestations), the
# container image to ghcr.io, and both files to the GitHub release.
#
# The order makes a failure stop it before anything is published, where
# it can: the tag on a commit of the default branch, a version this
# project releases (R4D-1), with its notes in CHANGELOG.md, and for a final
# version nothing pending (R6AB-7); the distributions checked, and the
# wheel installed and run; the whole test suite (R4A-5). Only then is the
# image built, on an x86-64 runner and on an ARM64 one, with no cache, and
# each pushed under its digest alone, which no tag names and nothing
# points to until the version tag, to be pulled back by that digest and
# run on the fixtures on its own architecture (S5-5). Then PyPI, which
# cannot be undone; then the version tag, on the two images that ran;
# pulled back with no credentials on each architecture and run again; only
# then its floating tags (1.0, 1, latest), which customers' runners follow
# (R4D-2); then the files' and the image's attestations, and the GitHub
# release. A step after PyPI that fails can be run again; so can PyPI's
# own, which skips a file already uploaded (R4D-9).
#
# Before the first release (your accounts; PREPUBLISH.md item 14): on PyPI,
# add this repository and workflow (release.yml, environment "pypi") as a
# trusted publisher of bellbriar-harness; on GitHub, create the environment
# "pypi" with a deployment rule allowing only tags v*, and protect v* tags
# with a ruleset. The image's package takes this repository's visibility,
# so it is public from its first push (1.0.0rc1 showed it).
#
# Every action is pinned to a commit (R4A-7); the comment names its release.
# Each job has a time limit (R4F-4).
name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# One release at a time: a run that starts while another runs waits for it,
# so the later run sees the earlier one's version when it moves the
# floating tags (R4H-2). GitHub keeps one waiting run; a tag pushed while
# one waits cancels that one, which can then be re-run.
concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  # The image's description, in its labels and annotations.
  DESCRIPTION: >-
    The Bellbriar accessibility harness, its Python dependencies and
    Chromium, on Playwright's Ubuntu image. Each part keeps its own
    license; the harness's are in its package metadata (License-Expression)
    and its NOTICE file

jobs:
  tests:
    name: The test suite
    uses: ./.github/workflows/bellbriar-eval.yml

  build:
    name: Build and check the distributions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      # The tools that build the files, pinned, also inside the isolated
      # environment `python -m build` makes (SB-5).
      PIP_CONSTRAINT: ${{ github.workspace }}/tools/build-constraints.txt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - id: version
        name: The tag names a version we release, on the default branch, with notes
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "the tag $GITHUB_REF_NAME does not name version $version"
            exit 1
          fi
          # A version the image steps after PyPI would refuse never
          # reaches PyPI (R4D-1).
          python tools/release_tags.py --check "$version"
          # Only a commit that reached the default branch, through its
          # review, is released (R4A-5).
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"; then
            echo "the tagged commit is not on $DEFAULT_BRANCH"
            exit 1
          fi
          python tools/release_notes.py "$version" > /dev/null
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: A final version leaves nothing pending (PREPUBLISH items 13 and 18)
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BELLBRIAR_RELEASE: "1"
        run: |
          # A release candidate (1.0.0rc1) rehearses with items pending; a
          # final version is released only when the suite's release check
          # passes: the worked example re-signed, no release blocker left
          # (tests/test_examples.py's RELEASE_BLOCKERS), no decision
          # pending (R6AB-7), the base image pinned by digest (SB-5). A
          # check that was skipped, not run, stops it too. It runs in a
          # copy, so the checkout the distributions are built from stays as
          # git made it.
          case "$VERSION" in
            *a[0-9]*|*b[0-9]*|*rc[0-9]*)
              echo "$VERSION is a pre-release: no release check" ;;
            *)
              cp -a . "$RUNNER_TEMP/release-check"
              cd "$RUNNER_TEMP/release-check"
              python -m pip install .
              python -m unittest -v tests.test_examples.TestPublishedExamples.test_nothing_is_pending_for_a_release 2>&1 | tee "$RUNNER_TEMP/release-check.log"
              grep -qx "OK" "$RUNNER_TEMP/release-check.log" || { echo "the release check did not run"; exit 1; } ;;
          esac
      # The times the files record: the wheel's entries are the commit's
      # (SOURCE_DATE_EPOCH), and so are the source distribution's copies
      # of the repository's files (each set to that time here); its
      # folders, the files the build writes into it (PKG-INFO, the
      # egg-info) and its gzip header keep this machine's clock (S5-5).
      # Printed: this job's Python and packages. `python -m build` builds
      # in an isolated environment of its own, which is not printed: its
      # setuptools is the one tools/build-constraints.txt pins
      # (PIP_CONSTRAINT, above).
      - name: Times from the commit, and the build's own environment
        run: |
          epoch=$(git log -1 --format=%ct)
          echo "SOURCE_DATE_EPOCH=$epoch" >> "$GITHUB_ENV"
          git ls-files -z | xargs -0 touch -h -d "@$epoch"
          python -VV
      - run: python -m pip install build "cryptography>=42"
      - run: python -m pip freeze --all
      - run: python tools/repo_guard.py
      - run: python -m build
      - run: python tools/check_dist.py dist
      - run: sha256sum dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  smoke:
    name: Install the wheel and run it
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: The installed commands work on the fixtures
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/python -m pip install dist/*.whl
          /tmp/venv/bin/bellbriar-eval --version
          /tmp/venv/bin/bellbriar-eval fixtures/good.html --fail-on tier1
          set +e
          /tmp/venv/bin/bellbriar-eval fixtures/bad.html --fail-on tier1 > /dev/null
          rc=$?
          set -e
          [ "$rc" -eq 1 ] || { echo "expected exit 1 on fixtures/bad.html, got $rc"; exit 1; }
          /tmp/venv/bin/bellbriar-lint fixtures/lint-good.jsx --fail-on error
          /tmp/venv/bin/bellbriar-evidence --help > /dev/null

  image-build:
    name: Build the image on ${{ matrix.platform }}, push it by digest, and run it
    # Nothing is pushed before the suite has passed and the wheel has run.
    needs: [build, tests, smoke]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      # Each architecture on its own hardware, with no emulation: the
      # image that runs here is the one published (S5-5).
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The labels and annotations the image gets: it holds Ubuntu,
      # Python, Chromium and more, each under its own licenses, so it
      # asserts none (R4D-6), and says where the harness's own are
      # (R4H-13). The version is the release's, not the tag's v1.0.0
      # (R4F-8).
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ghcr.io/bellbriar/harness
          labels: |
            org.opencontainers.image.licenses=NOASSERTION
            org.opencontainers.image.version=${{ needs.build.outputs.version }}
            org.opencontainers.image.description=${{ env.DESCRIPTION }}
          annotations: |
            org.opencontainers.image.licenses=NOASSERTION
            org.opencontainers.image.version=${{ needs.build.outputs.version }}
            org.opencontainers.image.description=${{ env.DESCRIPTION }}
      # Under its digest alone: no tag names it until it has run here and
      # PyPI holds its wheel. No cache: every layer is built in this job,
      # from the pinned base image and the release's own wheel.
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/bellbriar/harness,push-by-digest=true,name-canonical=true,push=true
          no-cache: true
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
      # The pushed image, pulled by its digest, renders the fixtures and
      # gates them as the package does (R4A-4), on this architecture.
      - name: The pushed image runs on the fixtures
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: python3 tools/image_check.py "ghcr.io/bellbriar/harness@$DIGEST"
      - name: Its digest, for the version tag
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          RUNNER: ${{ matrix.runner }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "not a digest: $DIGEST"; exit 1; }
          mkdir -p "$RUNNER_TEMP/digests"
          echo "$DIGEST" > "$RUNNER_TEMP/digests/$RUNNER"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.runner }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error

  pypi:
    name: Publish to PyPI
    needs: [tests, build, smoke, image-build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/bellbriar-harness
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      # A re-run that built the files again stops here, rather than let
      # the upload skip PyPI's own files without comparing them (SB-2).
      - name: The files PyPI already holds are these
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: python3 tools/pypi_files.py "$VERSION" dist
      # Attestations (PEP 740) are on by default. A re-run after a partial
      # upload skips the file already there (both come from one artifact).
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true

  image:
    name: Tag the version on the images that ran
    needs: [build, pypi, image-build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.index.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      # The images were built from these files: PyPI holds them now.
      - name: The images' wheel is the one PyPI holds
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: python3 tools/pypi_files.py --all "$VERSION" dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Its version only: the floating tags wait for the run below. The
      # index carries the labels' words too, which GitHub's package page
      # reads (R4F-8).
      - id: index
        name: The version tag, on both images
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          refs=()
          for f in "$RUNNER_TEMP"/digests/*; do
            digest=$(cat "$f")
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "not a digest: $digest"; exit 1; }
            refs+=("ghcr.io/bellbriar/harness@$digest")
          done
          [ "${#refs[@]}" -eq 2 ] || { echo "expected two images, found ${#refs[@]}"; exit 1; }
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.licenses=NOASSERTION" \
            --annotation "index:org.opencontainers.image.version=$VERSION" \
            --annotation "index:org.opencontainers.image.description=$DESCRIPTION" \
            -t "ghcr.io/bellbriar/harness:$VERSION" "${refs[@]}"
          digest=$(docker buildx imagetools inspect "ghcr.io/bellbriar/harness:$VERSION" --format '{{json .Manifest}}' | python3 -c 'import json, sys; print(json.load(sys.stdin)["digest"])')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "not a digest: $digest"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  public:
    name: Anyone can pull the image on ${{ matrix.runner }}, and it runs
    needs: [build, image]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pulled with no credentials, as a customer's runner pulls it
      # (R4A-3). The package takes the repository's visibility, so it is
      # public from the first push; were it private, this job would fail
      # until it is made public, and then be re-run.
      - env:
          VERSION: ${{ needs.build.outputs.version }}
        run: python3 tools/image_check.py "ghcr.io/bellbriar/harness:$VERSION" --pull

  tags:
    name: Point the floating image tags at the image that ran
    needs: [build, image, public]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      latest: ${{ steps.tags.outputs.latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Each floating tag (1.0, 1, latest) only while this is the newest
      # release it covers (R4A-13); none for a pre-release. The releases
      # are the published ones, not every v* tag: a tag whose run stopped
      # before publishing is none (R4F-11). They are the GitHub releases,
      # every page of them, and the versions on PyPI, where a run that
      # stopped before its GitHub release published (R4H-2). Right after
      # the first upload PyPI may not list the project yet: re-run this job.
      - id: tags
        env:
          VERSION: ${{ needs.build.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[] | select(.draft | not) | .tag_name' > released.txt
          curl -fsSL --retry 3 -H "Accept: application/vnd.pypi.simple.v1+json" https://pypi.org/simple/bellbriar-harness/ -o pypi.json
          python3 tools/release_tags.py "$VERSION" ghcr.io/bellbriar/harness --released released.txt --pypi pypi.json >> "$GITHUB_OUTPUT"
      - env:
          FLOATING: ${{ steps.tags.outputs.floating }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          floating="$FLOATING"
          dry=()
          if [ -z "$floating" ]; then
            # A pre-release moves no floating tag. The same lines run, with
            # --dry-run, which reads the image and pushes nothing, and a tag
            # that no release is given, so that a release candidate
            # rehearses them (S5-5).
            floating="ghcr.io/bellbriar/harness:rehearsal"
            dry=(--dry-run)
          fi
          args=()
          IFS=, read -r -a tags <<< "$floating"
          for tag in "${tags[@]}"; do args+=(-t "$tag"); done
          docker buildx imagetools create "${dry[@]}" "${args[@]}" "ghcr.io/bellbriar/harness@$DIGEST"
          if [ "${#dry[@]}" -gt 0 ]; then
            echo "no floating tags for this release: their command ran with --dry-run, which pushed nothing"
          fi

  attest:
    name: Attest the files and the image
    needs: [build, pypi, image, public]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The second job with an identity token, the publishing job being the
    # first: it runs the attestation action, which signs what this run
    # built (Sigstore), for `gh attestation verify`, and nothing else of
    # its own (S5-5).
    permissions:
      contents: read
      id-token: write
      attestations: write
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      # The image's attestation is pushed beside it, which needs the
      # registry's login.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # No storage record (GitHub's linked artifacts, for organizations):
      # the attestation is all this asks for, and the job has no
      # artifact-metadata permission.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/bellbriar/harness
          subject-digest: ${{ needs.image.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

  release:
    name: GitHub release
    needs: [build, pypi, image, public, tags, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Create the release with both files and the version's notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          DIGEST: ${{ needs.image.outputs.digest }}
          LATEST: ${{ needs.tags.outputs.latest }}
        run: |
          # The files attached are the ones PyPI holds (SB-2).
          python3 tools/pypi_files.py --all "$VERSION" dist
          python3 tools/release_notes.py "$VERSION" > notes.md
          printf '\nPyPI: https://pypi.org/project/bellbriar-harness/%s/\nImage: ghcr.io/bellbriar/harness:%s, digest %s (give the Action this digest as its version for runs that must never change)\nProvenance: gh attestation verify <file> --repo %s, or oci://ghcr.io/bellbriar/harness:%s in place of the file\n' "$VERSION" "$VERSION" "$DIGEST" "$GITHUB_REPOSITORY" "$VERSION" >> notes.md
          flags=()
          case "$VERSION" in *a*|*b*|*rc*) flags+=(--prerelease) ;; esac
          # GitHub's "Latest" only for the newest release, as the image's
          # latest tag (R4D-8).
          if [ "$LATEST" = "true" ]; then flags+=(--latest); else flags+=(--latest=false); fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$GITHUB_REF_NAME" --notes-file notes.md "${flags[@]}"
