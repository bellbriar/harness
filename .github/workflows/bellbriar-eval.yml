# Tests for THIS repository (the harness itself).
#
# The customer-facing CI gate — lint the source, build, gate the built
# output on Tier-1 fails — is a template in examples/ci/bellbriar-eval.yml.
# Copy that one into a site's repository; it does not belong here, because
# this repository has no site to build and no ./dist to gate.
#
# Every action is pinned to a commit, the only reference that cannot be
# moved (R4A-7); the comment names its release. Dependabot proposes updates
# (.github/dependabot.yml).
#
# Each job has a time limit, so one that hangs stops there, not at GitHub's
# six hours (R4F-4).
name: harness-tests
on:
  push:
    branches: ["**"]
  pull_request:
  # The release runs all of this before it publishes (R4A-5).
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  guard:
    name: Repository guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Every commit: a key added in one and removed in the next is
          # still in the history anyone clones (R4A-12).
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      # No private key, calibration golden set or pack enters the
      # repository (H5); .gitignore is the second line of defense.
      - run: python -m pip install "cryptography>=42"
      - run: python tools/repo_guard.py
      - run: python tools/repo_guard.py --history

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Not Windows, where the commands stop (support.py; L141).
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        include:
          # An Intel Mac: cryptography 49 and later publish no wheels for
          # it, so the package keeps it below 49 there (pyproject.toml).
          - os: macos-15-intel
            python-version: "3.13"
    steps:
      # Every commit: the suite reads the repository's history as the
      # guard does (tests/test_part_r4.py), which a shallow clone lacks.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      # Node runs the independent JavaScript verifier in
      # tests/test_canonicalization.py (canonical form + example signatures).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      # Install THIS checkout, never the PyPI name: the suite tests the
      # code in this commit.
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[dev,browser]"
      - run: python -m playwright install --with-deps chromium
      - name: Test suite (fails if the browser, crypto or Node tests would skip)
        env:
          BELLBRIAR_REQUIRE_ALL_TESTS: "1"
        run: python -m unittest discover -s tests -t . -v
      - name: CLI smoke test — clean fixture passes the gate, bad one fails it
        run: |
          bellbriar-eval fixtures/good.html --fail-on tier1
          set +e
          bellbriar-eval fixtures/bad.html --fail-on tier1 > /dev/null
          rc=$?
          set -e
          if [ "$rc" -ne 1 ]; then
            echo "expected exit 1 (gate failed) on fixtures/bad.html, got $rc"
            exit 1
          fi
      - name: Lint smoke test — the clean lint fixture has no errors
        run: bellbriar-lint fixtures/lint-good.jsx --fail-on error

  dist:
    name: Package (sdist and wheel)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: python -m pip install build "cryptography>=42"
      - run: python -m build
      # What ships: no key in either file, the licenses in both, and every
      # file git tracks in the sdist (P1-09, R4A-1).
      - run: python tools/check_dist.py dist
      - name: The whole suite runs from the source distribution
        env:
          BELLBRIAR_REQUIRE_ALL_TESTS: "1"
        run: |
          mkdir sdist && tar -xzf dist/*.tar.gz -C sdist --strip-components=1
          cd sdist
          python -m pip install ".[dev,browser]"
          python -m playwright install --with-deps chromium
          python -m unittest discover -s tests -t . -v

  image:
    name: Container image on ${{ matrix.runner }} (built, then run on the fixtures)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Each architecture the release publishes, on its own hardware.
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install build
      - run: python -m build --wheel
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          load: true
          push: false
          tags: bellbriar-harness:ci
      # Chromium's sandbox needs unprivileged user namespaces, which
      # Ubuntu 24.04 restricts (AppArmor): allowed on this runner, so the
      # check's sandbox run says what a host that allows them gets.
      - run: |
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns > /dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      # The browser the image ships renders the fixtures and gates them as
      # the package does (R4A-4).
      - run: python tools/image_check.py bellbriar-harness:ci
